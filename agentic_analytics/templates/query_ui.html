{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mb-4" style="min-height: 500px; display: flex; flex-direction: column;">
            <div class="card-header bg-primary text-white">
                Ollama Query Agent
            </div>
            <div class="card-body" id="chatWindow" style="flex-grow: 1; overflow-y: auto; max-height: 600px; background-color: #12141a;">
                <div class="text-muted p-2 text-center">Ask a question about the cybercrime dataset.</div>
            </div>
            <div class="card-footer border-secondary">
                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control bg-dark text-white border-secondary" placeholder="e.g. What types of cybercrime were common in 2022?">
                    <button class="btn btn-primary" id="askBtn" onclick="askQuestion()">Ask</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function askQuestion() {
    const input = document.getElementById('queryInput');
    const question = input.value.trim();
    if (!question) return;
    
    const chatWindow = document.getElementById('chatWindow');
    input.value = '';
    
    // Append user question
    chatWindow.innerHTML += `<div class="mb-3 text-end"><span class="bg-secondary rounded p-2 d-inline-block">${question}</span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;
    
    // Append Agent placeholder
    const agentMsgId = "msg-" + Date.now();
    chatWindow.innerHTML += `<div class="mb-3 text-start"><span id="${agentMsgId}" class="bg-dark border border-secondary rounded p-2 d-inline-block" style="white-space: pre-wrap; max-width: 85%;">...</span></div>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;
    
    try {
        const response = await fetch('/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question, model: 'llama3' })
        });
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        const agentSpan = document.getElementById(agentMsgId);
        agentSpan.innerText = ""; // clear ...
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            agentSpan.innerText += chunk;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    } catch (e) {
        document.getElementById(agentMsgId).innerText = "Error: " + e.message;
    }
}

// Enter to submit
document.getElementById('queryInput').addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    document.getElementById("askBtn").click();
  }
});
</script>
{% endblock %}
