<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercrime Analytics Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f1117; color: #ffffff; }
        .navbar { background-color: #1a1d24 !important; border-bottom: 1px solid #2d313a; }
        .card { background-color: #1a1d24; border: 1px solid #2d313a; border-radius: 8px; }
        .card-header { border-bottom: 1px solid #2d313a; font-weight: 600; background-color: #20242c; }
        .table { color: #e0e0e0; }
        .table thead th { border-bottom-color: #2d313a; color: #fff; }
        .table td, .table th { border-color: #2d313a; }
        .stat-card { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #4dc9f6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🕵️ CyberIntel Dashboard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/analytics">Advanced Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/explore">Data Explorer</a></li>
        <li class="nav-item"><a class="nav-link" href="/query-ui">LLM Agent</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
